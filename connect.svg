<svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" width="900" height="160">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0C10"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <filter id="ctaGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="160" rx="12" fill="url(#ctaBg)"/>

  <!-- Animated border -->
  <rect x="2" y="2" width="896" height="156" rx="10" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="12 6">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents -->
  <rect x="0" y="0" width="40" height="3" fill="#F97316" rx="1"/>
  <rect x="0" y="0" width="3" height="40" fill="#F97316" rx="1"/>
  <rect x="860" y="0" width="40" height="3" fill="#22C55E" rx="1"/>
  <rect x="897" y="0" width="3" height="40" fill="#22C55E" rx="1"/>
  <rect x="0" y="157" width="40" height="3" fill="#22C55E" rx="1"/>
  <rect x="0" y="120" width="3" height="40" fill="#22C55E" rx="1"/>
  <rect x="860" y="157" width="40" height="3" fill="#F97316" rx="1"/>
  <rect x="897" y="120" width="3" height="40" fill="#F97316" rx="1"/>

  <!-- Main CTA text -->
  <text x="450" y="52" font-family="monospace" font-size="11" fill="#6B7280" text-anchor="middle" letter-spacing="4">━━━━━  LET'S CONNECT  ━━━━━</text>
  <text x="450" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="900" fill="#F9FAFB" text-anchor="middle" filter="url(#ctaGlow)">LET'S BUILD SOMETHING USEFUL.</text>

  <!-- Accent underline -->
  <rect x="280" y="100" width="340" height="2" rx="1" fill="#F97316" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="132" font-family="monospace" font-size="12" fill="#9CA3AF" text-anchor="middle">manufolio.vercel.app ↗</text>
  <text x="450" y="150" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle" letter-spacing="2">SOFTWARE ENGINEERING · AI / ML · OPEN TO COLLABORATE</text>
</svg>
