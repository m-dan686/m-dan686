<svg viewBox="0 0 900 30" xmlns="http://www.w3.org/2000/svg" width="900" height="30">
  <line x1="0" y1="15" x2="360" y2="15" stroke="#1F2937" stroke-width="1"/>
  <circle cx="390" cy="15" r="3" fill="#F97316" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="410" cy="15" r="2" fill="#22C55E" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="15" r="4" fill="#F97316" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="490" cy="15" r="2" fill="#22C55E" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="15" r="3" fill="#F97316" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <line x1="540" y1="15" x2="900" y2="15" stroke="#1F2937" stroke-width="1"/>
  <!-- Moving particle -->
  <circle cx="0" cy="15" r="2" fill="#F97316" opacity="0.7">
    <animate attributeName="cx" values="0;900;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.7;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
