<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" width="900" height="240">
  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0C10"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" rx="10" fill="url(#tsBg)"/>
  <rect width="900" height="240" rx="10" fill="none" stroke="#1F2937" stroke-width="1"/>

  <!-- Section label -->
  <text x="450" y="30" font-family="monospace" font-size="11" fill="#6B7280" text-anchor="middle" letter-spacing="4">TECH ARSENAL // ACTIVE STACK</text>
  <line x1="150" y1="35" x2="340" y2="35" stroke="#F97316" stroke-width="0.5" opacity="0.5"/>
  <line x1="560" y1="35" x2="750" y2="35" stroke="#F97316" stroke-width="0.5" opacity="0.5"/>

  <!-- Row 1: Languages -->
  <!-- Python -->
  <g transform="translate(100,95)">
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="#111827" stroke="#F97316" stroke-width="1.2" opacity="0.9"/>
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="none" stroke="#F97316" stroke-width="1.2">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-8" font-family="monospace" font-size="18" fill="#F97316" text-anchor="middle">🐍</text>
    <text x="0" y="18" font-family="monospace" font-size="9" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">PYTHON</text>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="35;40;35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Java -->
  <g transform="translate(230,95)">
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="#111827" stroke="#F97316" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="-8" font-family="monospace" font-size="18" fill="#F97316" text-anchor="middle">☕</text>
    <text x="0" y="18" font-family="monospace" font-size="9" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">JAVA</text>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="35;40;35" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- C++ -->
  <g transform="translate(360,95)">
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="#111827" stroke="#F97316" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="-8" font-family="monospace" font-size="16" fill="#F97316" text-anchor="middle" font-weight="bold">C++</text>
    <text x="0" y="18" font-family="monospace" font-size="9" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">C PLUS PLUS</text>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="35;40;35" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- React -->
  <g transform="translate(490,95)">
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="#111827" stroke="#22C55E" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="-8" font-family="monospace" font-size="18" fill="#22C55E" text-anchor="middle">⚛</text>
    <text x="0" y="18" font-family="monospace" font-size="9" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">REACT.JS</text>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#22C55E" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="35;40;35" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- AI/ML -->
  <g transform="translate(620,95)">
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="#111827" stroke="#22C55E" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="-8" font-family="monospace" font-size="16" fill="#22C55E" text-anchor="middle">🤖</text>
    <text x="0" y="18" font-family="monospace" font-size="9" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">AI / ML</text>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#22C55E" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="35;40;35" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- MySQL -->
  <g transform="translate(750,95)">
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="#111827" stroke="#F97316" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="-8" font-family="monospace" font-size="16" fill="#F97316" text-anchor="middle">🗄</text>
    <text x="0" y="18" font-family="monospace" font-size="9" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">MYSQL</text>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="35;40;35" dur="3.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="3.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connecting dots between nodes (horizontal flow) -->
  <g opacity="0.4">
    <circle cx="165" cy="95" r="2" fill="#F97316">
      <animate attributeName="cx" values="165;225" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="295" cy="95" r="2" fill="#F97316">
      <animate attributeName="cx" values="295;355" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="95" r="2" fill="#22C55E">
      <animate attributeName="cx" values="425;485" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="555" cy="95" r="2" fill="#22C55E">
      <animate attributeName="cx" values="555;615" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="685" cy="95" r="2" fill="#F97316">
      <animate attributeName="cx" values="685;745" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Row 2 labels -->
  <text x="100" y="170" font-family="monospace" font-size="9" fill="#6B7280" text-anchor="middle" letter-spacing="1">HTML · CSS · JS</text>
  <text x="250" y="170" font-family="monospace" font-size="9" fill="#6B7280" text-anchor="middle" letter-spacing="1">DATA SCIENCE</text>
  <text x="450" y="170" font-family="monospace" font-size="9" fill="#6B7280" text-anchor="middle" letter-spacing="1">GIT · GITHUB</text>
  <text x="650" y="170" font-family="monospace" font-size="9" fill="#6B7280" text-anchor="middle" letter-spacing="1">OOP · DSA</text>

  <!-- Bottom accent -->
  <line x1="20" y1="210" x2="880" y2="210" stroke="#1F2937" stroke-width="1"/>
  <text x="450" y="228" font-family="monospace" font-size="9" fill="#374151" text-anchor="middle" letter-spacing="3">BUILDING WITH PURPOSE</text>
</svg>
