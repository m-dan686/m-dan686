  <circle cx="40" cy="18" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="58" cy="18" r="5" fill="#22C55E" opacity="0.8"/>

  <!-- Title -->
  <text x="350" y="23" font-family="monospace" font-size="11" fill="#6B7280" text-anchor="middle">manu@github: ~</text>

  <!-- Terminal content lines -->
