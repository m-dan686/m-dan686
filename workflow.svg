<svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" width="900" height="180">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B0C10"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0B0C10"/>
    </linearGradient>
    <filter id="wfGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="180" rx="10" fill="url(#wfBg)"/>
  <rect width="900" height="180" rx="10" fill="none" stroke="#1F2937" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="28" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle" letter-spacing="4">ENGINEERING WORKFLOW</text>

  <!-- Pipeline nodes -->
  <!-- IDEA -->
  <g transform="translate(65,95)">
    <circle cx="0" cy="0" r="28" fill="#111827" stroke="#F97316" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="monospace" font-size="14" fill="#F97316" text-anchor="middle">💡</text>
    <text x="0" y="10" font-family="monospace" font-size="7" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">IDEA</text>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="32;38;32" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Arrow 1 + moving particle -->
  <line x1="95" y1="95" x2="165" y2="95" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <circle cx="95" cy="95" r="3" fill="#F97316" filter="url(#wfGlow)">
    <animate attributeName="cx" values="95;165;95" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- RESEARCH -->
  <g transform="translate(195,95)">
    <circle cx="0" cy="0" r="28" fill="#111827" stroke="#F97316" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="monospace" font-size="14" fill="#F97316" text-anchor="middle">🔍</text>
    <text x="0" y="10" font-family="monospace" font-size="7" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">RESEARCH</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="225" y1="95" x2="295" y2="95" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <circle cx="225" cy="95" r="3" fill="#F97316" filter="url(#wfGlow)">
    <animate attributeName="cx" values="225;295;225" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- DESIGN -->
  <g transform="translate(325,95)">
    <circle cx="0" cy="0" r="28" fill="#111827" stroke="#F97316" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="monospace" font-size="14" fill="#F97316" text-anchor="middle">🎨</text>
    <text x="0" y="10" font-family="monospace" font-size="7" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">DESIGN</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="355" y1="95" x2="425" y2="95" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <circle cx="355" cy="95" r="3" fill="#22C55E" filter="url(#wfGlow)">
    <animate attributeName="cx" values="355;425;355" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- BUILD -->
  <g transform="translate(455,95)">
    <circle cx="0" cy="0" r="28" fill="#111827" stroke="#22C55E" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="monospace" font-size="14" fill="#22C55E" text-anchor="middle">⚙</text>
    <text x="0" y="10" font-family="monospace" font-size="7" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">BUILD</text>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#22C55E" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="32;38;32" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Arrow 4 -->
  <line x1="485" y1="95" x2="555" y2="95" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <circle cx="485" cy="95" r="3" fill="#22C55E" filter="url(#wfGlow)">
    <animate attributeName="cx" values="485;555;485" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- AI/ML -->
  <g transform="translate(585,95)">
    <circle cx="0" cy="0" r="28" fill="#111827" stroke="#22C55E" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="monospace" font-size="14" fill="#22C55E" text-anchor="middle">🤖</text>
    <text x="0" y="10" font-family="monospace" font-size="7" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">AI / ML</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="615" y1="95" x2="685" y2="95" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <circle cx="615" cy="95" r="3" fill="#F97316" filter="url(#wfGlow)">
    <animate attributeName="cx" values="615;685;615" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- TEST -->
  <g transform="translate(715,95)">
    <circle cx="0" cy="0" r="28" fill="#111827" stroke="#F97316" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="monospace" font-size="14" fill="#F97316" text-anchor="middle">🧪</text>
    <text x="0" y="10" font-family="monospace" font-size="7" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">TEST</text>
  </g>

  <!-- Arrow 6 -->
  <line x1="745" y1="95" x2="815" y2="95" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <circle cx="745" cy="95" r="3" fill="#F97316" filter="url(#wfGlow)">
    <animate attributeName="cx" values="745;815;745" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- DEPLOY -->
  <g transform="translate(845,95)">
    <circle cx="0" cy="0" r="28" fill="#111827" stroke="#22C55E" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="monospace" font-size="14" fill="#22C55E" text-anchor="middle">🚀</text>
    <text x="0" y="10" font-family="monospace" font-size="7" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">DEPLOY</text>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#22C55E" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="32;38;32" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom border accent -->
  <line x1="0" y1="178" x2="900" y2="178" stroke="#F97316" stroke-width="1" opacity="0.3"/>
</svg>
